# GoReleaser config (SPEC §A3). Run in CI on tag; signing steps carry
# TODO(keys) markers until release keys/certs exist.
version: 2

project_name: flockd

before:
  hooks:
    - go mod tidy

builds:
  - id: flockd
    main: ./cmd/flockd
    binary: flockd
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}
  - id: flock
    main: ./cmd/flock
    binary: flock
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

universal_binaries:
  - id: flockd-universal
    ids: [flockd]
    name_template: flockd
    replace: true
  - id: flock-universal
    ids: [flock]
    name_template: flock
    replace: true

archives:
  - id: default
    ids: [flockd, flock, flockd-universal, flock-universal]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE, docs/*]

nfpms:
  - id: packages
    package_name: teraflock
    ids: [flockd, flock]
    vendor: Teraflock
    homepage: https://teraflock.ai
    maintainer: Teraflock <hello@teraflock.ai>
    description: Teraflock node daemon and CLI — serve LLM inference on idle hardware.
    license: Apache-2.0
    formats: [deb, rpm]
    contents:
      - src: ./LICENSE
        dst: /usr/share/doc/teraflock/LICENSE

checksum:
  name_template: checksums.txt

# TODO(keys): enable once the cosign release key exists (offline/HSM — this
# is the most sensitive key in the company, SPEC §6 / §A3).
# signs:
#   - cmd: cosign
#     artifacts: checksum
#     args: ["sign-blob", "--key", "env://COSIGN_KEY", "--output-signature", "${signature}", "${artifact}"]
#
# TODO(keys): macOS Developer ID signing + notarization (notarytool) hooks,
# and Windows Authenticode (Azure Trusted Signing) — required before public
# distribution; unsigned daemons are dead on arrival (SPEC §A3).

brews:
  - name: flock
    ids: [default]
    repository:
      owner: teraflock
      name: homebrew-tap
      # Local releases use the ambient GITHUB_TOKEN (gh auth); CI needs a
      # TAP_GITHUB_TOKEN PAT with write access to homebrew-tap.
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://teraflock.ai
    description: Teraflock node daemon + CLI — earn credits serving LLM inference on idle hardware
    license: Apache-2.0
    install: |
      bin.install "flockd"
      bin.install "flock"
    caveats: |
      Binaries are not yet notarized (beta). To join the mesh you need an
      invite from teraflock.ai — then:
        flock login      # opens the claim page in your browser
        flock up         # installs and starts the background service
        flock dashboard  # watch it earn
    skip_upload: false

winget:
  - name: flock
    publisher: Teraflock
    package_identifier: Teraflock.flock
    short_description: Teraflock node daemon + CLI
    license: Apache-2.0
    repository:
      owner: teraflock
      name: winget-pkgs
      branch: flock-{{.Version}}
    skip_upload: true # TODO(keys): flip when the publisher account exists

release:
  draft: false
  footer: |
    ---
    Install: see README. Verify checksums with `sha256sum -c checksums.txt`.

snapshot:
  version_template: "{{ incpatch .Version }}-dev"
