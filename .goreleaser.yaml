# GoReleaser config (SPEC §A3). Run in CI on tag (ci.yml `release` job).
#
# Signing (teraflock/flockd#26) is wired end to end and keyed on secrets and
# variables, so the same config produces an unsigned snapshot on a laptop and
# a signed, notarized release the moment the keys exist:
#   macOS    universal_binaries post hook -> scripts/release/sign-macos.sh
#            (Developer ID + hardened runtime + notarization via rcodesign)
#   Windows  builds post hook -> scripts/release/sign-windows.sh
#            (Authenticode via Azure Trusted Signing, jsign)
#   cosign   signs: -> scripts/release/cosign-sign.sh over checksums.txt
#            (COSIGN_MODE=keyless|kms, docs#34)
# The policy (SIGNING_REQUIRED, which secrets each leg needs, "present
# secrets are always used, failures are always fatal") lives in
# scripts/release/lib.sh. `goreleaser release --snapshot --skip=publish,sign`
# needs none of it.
version: 2

project_name: flockd

before:
  hooks:
    - go mod tidy

builds:
  - id: flockd
    main: ./cmd/flockd
    binary: flockd
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}
    hooks:
      post:
        # Authenticode; a no-op for non-.exe targets and without Azure secrets.
        - cmd: scripts/release/sign-windows.sh {{ .Path }}
          output: true
  - id: tera
    main: ./cmd/tera
    binary: tera
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}
    hooks:
      post:
        # Authenticode; a no-op for non-.exe targets and without Azure secrets.
        - cmd: scripts/release/sign-windows.sh {{ .Path }}
          output: true

# The darwin archives ship only the lipo'd binaries (replace: true), so
# these are the Mach-Os that get signed and notarized.
universal_binaries:
  - id: flockd-universal
    ids: [flockd]
    name_template: flockd
    replace: true
    hooks:
      post:
        - cmd: scripts/release/sign-macos.sh {{ .Path }}
          output: true
  - id: tera-universal
    ids: [tera]
    name_template: tera
    replace: true
    hooks:
      post:
        - cmd: scripts/release/sign-macos.sh {{ .Path }}
          output: true

archives:
  - id: default
    ids: [flockd, tera, flockd-universal, tera-universal]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE, docs/*]

nfpms:
  - id: packages
    package_name: teraflock
    ids: [flockd, tera]
    vendor: Teraflock
    homepage: https://teraflock.ai
    maintainer: Teraflock <hello@teraflock.ai>
    description: Teraflock node daemon and CLI — serve LLM inference on idle hardware.
    license: Apache-2.0
    formats: [deb, rpm]
    contents:
      - src: ./LICENSE
        dst: /usr/share/doc/teraflock/LICENSE

checksum:
  name_template: checksums.txt

# One Sigstore bundle over checksums.txt covers every archive and package.
# COSIGN_MODE=keyless|kms selects the custody shape (docs#34); when it is
# unset the release job passes --skip=sign, so this block never runs with
# nothing to sign. cosign v3 emits bundles, not detached .sig files.
signs:
  - id: cosign
    cmd: scripts/release/cosign-sign.sh
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["${artifact}", "${signature}"]
    output: true

# Homebrew distribution is a cask, not a formula: goreleaser hard-deprecated
# `brews` in v2.16, and Homebrew's own guidance is that pre-built binaries
# belong in casks rather than formulas that pretend to build from source.
#
# Casks are macOS-only. Linuxbrew cannot install them, so Linux users take
# install.sh or the deb/rpm from nfpms above — install.sh only prefers brew
# on darwin for exactly this reason.
homebrew_casks:
  - name: tera
    ids: [default]
    binaries: [flockd, tera]
    repository:
      owner: teraflock
      name: homebrew-tap
      # Local releases use the ambient GITHUB_TOKEN (gh auth); CI needs a
      # TAP_GITHUB_TOKEN PAT with write access to homebrew-tap.
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://teraflock.ai
    description: Teraflock node daemon + CLI — earn credits serving LLM inference on idle hardware
    # Quarantine workaround, present ONLY in releases whose darwin binaries
    # were not Developer ID signed + notarized (teraflock/flockd#27).
    # scripts/release/preflight.sh exports TERAFLOCK_MACOS_SIGNED=true when
    # the Apple secrets exist, and sign-macos.sh then fails the job rather
    # than let an unsigned binary through, so a cask generated without this
    # hook always points at notarized binaries. Unsigned (beta) binaries
    # would otherwise be reported as "damaged" by Gatekeeper; the hook
    # strips the xattr at install time and says so. Delete the whole block
    # once every release is notarized (issue #27 has the diff).
    hooks:
      post:
        install: |-
          {{- if ne (envOrDefault "TERAFLOCK_MACOS_SIGNED" "") "true" }}
          if OS.mac?
            opoo "tera #{version} is a beta build that is not yet notarized; stripping the quarantine flag so it runs."
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/tera"]
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/flockd"]
          end
          {{- end -}}
    caveats: |
      To join the mesh you need an invite from teraflock.ai — then:
        tera login      # opens the claim page in your browser
        tera up         # installs and starts the background service
        tera dashboard  # watch it earn
    skip_upload: false

winget:
  - name: tera
    publisher: Teraflock
    package_identifier: Teraflock.tera
    short_description: Teraflock node daemon + CLI
    license: Apache-2.0
    repository:
      owner: teraflock
      name: winget-pkgs
      branch: tera-{{.Version}}
    skip_upload: true # TODO(keys): flip when the publisher account exists

release:
  draft: false
  # Templated on the same variables the signing legs use, so the notes say
  # exactly what this release's artifacts carry.
  footer: |
    ---
    **Install:** see the README. **Checksums:** `sha256sum -c --ignore-missing checksums.txt`

    {{ $mode := envOrDefault "COSIGN_MODE" "" -}}
    {{ if eq $mode "keyless" -}}
    **cosign:** `checksums.txt.sigstore.json` is a keyless Sigstore bundle over `checksums.txt`:
    ```
    cosign verify-blob --bundle checksums.txt.sigstore.json \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      --certificate-identity-regexp '^https://github.com/teraflock/flockd/' checksums.txt
    ```
    {{- else if eq $mode "kms" -}}
    **cosign:** `checksums.txt.sigstore.json` is a Sigstore bundle over `checksums.txt` signed with the Teraflock release key (public key in the README):
    ```
    cosign verify-blob --bundle checksums.txt.sigstore.json --key teraflock-release.pub checksums.txt
    ```
    {{- else -}}
    **cosign:** this release carries no cosign signature yet.
    {{- end }}

    {{ if eq (envOrDefault "TERAFLOCK_MACOS_SIGNED" "") "true" -}}
    **macOS:** `flockd` and `tera` are Developer ID signed and notarized: `codesign -dv --verbose=2 tera` shows `Authority=Developer ID Application`, `spctl -a -vv -t install tera` reports `accepted`.
    {{- else -}}
    **macOS:** `flockd` and `tera` are **not yet notarized** (beta): the brew cask strips the quarantine flag; a direct download needs `xattr -d com.apple.quarantine flockd tera`.
    {{- end }}

    {{ if eq (envOrDefault "TERAFLOCK_WINDOWS_SIGNED" "") "true" -}}
    **Windows:** `flockd.exe` and `tera.exe` are Authenticode signed: `Get-AuthenticodeSignature tera.exe` reports `Valid`.
    {{- else -}}
    **Windows:** `flockd.exe` and `tera.exe` are **not yet Authenticode signed**: expect a SmartScreen prompt.
    {{- end }}

snapshot:
  version_template: "{{ incpatch .Version }}-dev"
