# golangci-lint v2 config (curated per SPEC §A3; CI runs this — the tool is
# not vendored locally).
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - misspell
    - unconvert
    - unparam
    - gosec
    - errorlint
    - contextcheck
    - nilerr
    - bodyclose
    - noctx
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*net/http.Response.Body).Close
    gosec:
      excludes:
        - G404 # math/rand is fine for jitter/mock determinism; flagged inline otherwise
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - noctx
          - bodyclose

formatters:
  enable:
    - gofmt
    - goimports
