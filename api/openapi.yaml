openapi: 3.0.3
info:
  title: flockd local API
  description: |
    The Teraflock node daemon's loopback HTTP surface on `localhost:7777`.

    Two halves:
    - **management** (`/api/v1/*`): the REST+SSE API behind the CLI, TUI,
      embedded web dashboard, and desktop app. Bearer-token auth (the token
      lives at `<data_dir>/local_api_token`, 0600 — same-user access is the
      security model). This spec **generates the daemon's router and types**
      (oapi-codegen, `make gen`): it cannot drift from the implementation.
    - **openai** (`/v1/*`): the OpenAI-compatible inference surface. Wire
      format follows the OpenAI API; endpooints are documented here for
      completeness but their schemas are owned by that external standard.
      The exception is `POST /v1/systemone` (typed decisions, TypeSafe's
      "System One" API), which is fully typed here: `SystemOneRequest` /
      `SystemOneResponse`.
      Keyless on loopback unless `local_api.require_auth_v1` is set.
  version: "1.0"
servers:
  - url: http://127.0.0.1:7777
tags:
  - name: management
    description: Daemon management (generated server)
  - name: events
    description: Server-sent events (hand-written handler; documented here)
  - name: openai
    description: OpenAI-compatible inference (external standard; hand-written)

security:
  - bearerAuth: []

paths:
  /api/v1/health:
    get:
      tags: [management]
      operationId: getHealth
      summary: Liveness probe
      description: >
        The one unauthenticated management route: `tera up`, service
        managers, and the desktop app probe it before they hold a token.
      security: []
      responses:
        "200":
          description: Daemon is up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /api/v1/status:
    get:
      tags: [management]
      operationId: getStatus
      summary: Node status snapshot
      responses:
        "200":
          description: Current node status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/catalog:
    get:
      tags: [management]
      operationId: getCatalog
      summary: Model catalog merged with local state
      parameters:
        - name: refresh
          in: query
          required: false
          schema: { type: boolean }
          description: Force a refetch instead of the cached copy (15 min TTL).
      responses:
        "200":
          description: Catalog entries with installed/loaded/default state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501": { $ref: "#/components/responses/Unsupported" }
        "502": { $ref: "#/components/responses/Upstream" }

  /api/v1/models:
    get:
      tags: [management]
      operationId: listModels
      summary: Locally installed models
      responses:
        "200":
          description: Cache contents merged with runtime state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/models/{id}/pin:
    post:
      tags: [management]
      operationId: pinModel
      summary: Pin or unpin a model (pinned models are never LRU-evicted)
      parameters: [{ $ref: "#/components/parameters/ModelID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PinRequest" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/Unsupported" }

  /api/v1/models/{id}/download:
    post:
      tags: [management]
      operationId: startModelDownload
      summary: Start downloading a catalog model in the background
      description: >
        202 when a download starts (or is already in flight); 200 when the
        model is already cached and ready. Progress streams over
        `/api/v1/events` as `model_progress` and shows in `received_bytes`
        on the model list.
      parameters: [{ $ref: "#/components/parameters/ModelID" }]
      responses:
        "200":
          description: Already downloaded and verified.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadStatus" }
        "202":
          description: Download running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/Unsupported" }
        "502": { $ref: "#/components/responses/Upstream" }
    delete:
      tags: [management]
      operationId: cancelModelDownload
      summary: Cancel an in-flight download (the .partial file is kept for resume)
      parameters: [{ $ref: "#/components/parameters/ModelID" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/Unsupported" }

  /api/v1/models/{id}/load:
    post:
      tags: [management]
      operationId: loadModel
      summary: Load a model into the serving runtime
      description: >
        Synchronous — llama-server startup takes seconds and the caller
        wants the verdict. Downloads first if the artifact isn't cached.
      parameters: [{ $ref: "#/components/parameters/ModelID" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/Unsupported" }
        "502": { $ref: "#/components/responses/Upstream" }

  /api/v1/models/{id}/unload:
    post:
      tags: [management]
      operationId: unloadModel
      summary: Unload a model from the runtime (the artifact stays cached)
      parameters: [{ $ref: "#/components/parameters/ModelID" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/Unsupported" }

  /api/v1/models/{id}/default:
    post:
      tags: [management]
      operationId: setDefaultModel
      summary: Serve this model when a request names none (must be loaded)
      description: >-
        Only a chat model can be the default: a decision or embedding
        model is refused with `400`. With no chat model loaded the node
        has no default (`status.default_model` is empty).
      parameters: [{ $ref: "#/components/parameters/ModelID" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/Unsupported" }

  /api/v1/models/{id}:
    delete:
      tags: [management]
      operationId: deleteModel
      summary: Delete a model from disk (and unload it if loaded)
      parameters: [{ $ref: "#/components/parameters/ModelID" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/Unsupported" }

  /api/v1/earnings:
    get:
      tags: [management]
      operationId: getEarnings
      summary: Earnings (ledger-backed when enrolled, else a labelled estimate)
      responses:
        "200":
          description: Earnings snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Earnings" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/limits:
    get:
      tags: [management]
      operationId: getLimits
      summary: Live governor limits
      responses:
        "200":
          description: Active limits.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Limits" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501": { $ref: "#/components/responses/Unsupported" }
    put:
      tags: [management]
      operationId: updateLimits
      summary: Update governor limits
      description: >
        Applies live and persists to the daemon-owned
        `<data_dir>/limits.toml` overlay; the operator's config.toml is
        never rewritten.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Limits" }
      responses:
        "200":
          description: The applied limits.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Limits" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501": { $ref: "#/components/responses/Unsupported" }

  /api/v1/logs:
    get:
      tags: [management]
      operationId: getLogs
      summary: Recent daemon log entries (ring buffer)
      parameters:
        - name: n
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1024 }
          description: Max entries to return (default 200). `limit` is an accepted alias.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1024 }
          description: Alias for `n`.
      responses:
        "200":
          description: Oldest-first log entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/enroll:
    post:
      tags: [management]
      operationId: enrollNode
      summary: Enroll (or re-enroll) this node with the coordinator
      description: >
        Submits a claim code to the running daemon: enrollment plus a live
        tunnel (re)start, no restart required. Re-enrollment — needed when
        the mesh CA rotates — is only possible through this route; the
        startup path ignores claim codes while credentials exist.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollRequest" }
      responses:
        "200":
          description: Enrolled; the tunnel is running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Another enrollment is already in progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501": { $ref: "#/components/responses/Unsupported" }
        "502": { $ref: "#/components/responses/Upstream" }

  /api/v1/activity:
    get:
      tags: [management]
      operationId: getActivity
      summary: Recent node activity (downloads, loads, evictions, declines)
      description: >
        The last 200 things the daemon did to its model store and runtimes,
        newest first, including everything the mesh did on the operator's
        behalf. In memory only; cleared on restart.
      responses:
        "200":
          description: Activity rows.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/requests:
    get:
      tags: [management]
      operationId: getRequests
      summary: What the node is doing right now, and what it did recently
      description: |
        The live activity view: per loaded model the requests in flight,
        every in-flight request (kind, origin, elapsed, tokens so far),
        model operations that use the machine without a request (a runtime
        starting, a download), and the last finished requests (a bounded
        in-memory list of the last 200, newest first) — enough to answer "what was
        that GPU spike two minutes ago".

        Facts only, never content: no prompt, no output, no error text and
        no identifier from outside the node (`id` is a counter local to
        this daemon process, there to match `request_started` /
        `request_finished` events). A request appears once it has passed
        admission and reached the runtime; one refused before that (node
        yielded, unknown model) did no work and is not listed.

        Live updates: the `request_started` and `request_finished` SSE
        events carry the same objects, and every `status` event carries
        `activity` (the `models` and `operations` parts).
      parameters:
        - name: recent
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 200 }
          description: Max finished requests to return (default 50; 0 = none).
      responses:
        "200":
          description: In-flight and recent requests.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestActivity" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/update/check:
    post:
      tags: [management]
      operationId: checkUpdate
      summary: Run a version check now
      description: >
        Fetches the version feed immediately (the daemon otherwise checks
        on startup and hourly) and returns the result.
      responses:
        "200":
          description: Check result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Update" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/Upstream" }

  /api/v1/events:
    get:
      tags: [events]
      operationId: getEvents
      summary: Live daemon events (SSE)
      description: |
        `text/event-stream`. Event types:
        - `status`: a full Status snapshot — every 2s, and immediately on
          governor state transitions and after enrollment.
        - `model_progress`: `{model, received_bytes, total_bytes}` during
          downloads (throttled).
        - `models_changed`: `{model, change}` where change is
          downloaded|loading|loaded|load_failed|unloaded|default|resized
          (`resized`: the model's slot count changed to follow demand), or
          `{change: catalog}` when a refreshed catalog differs from the one
          held. `loading` is a runtime starting (weights being read into
          memory); it ends with `loaded` or `load_failed`.
        - `request_started`: one InflightRequest when a request reaches a
          runtime (`elapsed_ms` 0, `tokens` 0).
        - `request_finished`: one FinishedRequest when it ends (same `id`).
        - `model_assignment`: `{model, state, error}` as a coordinator
          placement moves through assigned|downloading|ready|cached|
          declined|failed|evicted.
        - `activity`: one ActivityEvent as it happens (same rows as
          `GET /api/v1/activity`).
        - `update_available`: the Update object when a version check finds
          a newer release (once per discovered version).
        - `log` (only with `?logs=1`): one LogEntry per line as logged.

        EventSource cannot send headers, so this route additionally accepts
        the bearer token as `?token=`. Hand-written handler — documented
        here, excluded from codegen.
      parameters:
        - name: logs
          in: query
          required: false
          schema: { type: boolean }
        - name: token
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: SSE stream.
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/models:
    get:
      tags: [openai]
      operationId: openaiListModels
      summary: OpenAI-compatible model list
      security: []
      responses:
        "200":
          description: OpenAI `list` object of loaded models.
          content:
            application/json:
              schema: { type: object }
  /v1/chat/completions:
    post:
      tags: [openai]
      operationId: openaiChatCompletions
      summary: OpenAI-compatible chat completions (streaming supported)
      description: |
        Reasoning models: chain-of-thought is returned separately from the
        answer as `reasoning_content` (the DeepSeek / llama.cpp extension
        to the OpenAI shape) — on `choices[].message.reasoning_content` for
        non-streaming responses and on `choices[].delta.reasoning_content`
        for stream chunks — and is absent when the model produced none.
        Reasoning tokens count in `usage.completion_tokens`. Models whose
        thinking llama.cpp cannot parse still return it inline in `content`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: "Completion (or SSE stream when `stream: true`). Chat messages/deltas may carry `reasoning_content`."
          content:
            application/json:
              schema: { type: object }
        "404":
          description: >-
            Unknown model, or a decision model (`error.code:
            model_not_found`, "model \"<id>\" is a decision model: use POST
            /v1/systemone").
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: The governor refuses inference right now (state in the message).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/completions:
    post:
      tags: [openai]
      operationId: openaiCompletions
      summary: OpenAI-compatible text completions
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Completion.
          content:
            application/json:
              schema: { type: object }
        "404":
          description: >-
            Unknown model, or a decision model (`error.code:
            model_not_found`, "model \"<id>\" is a decision model: use POST
            /v1/systemone").
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/embeddings:
    post:
      tags: [openai]
      operationId: openaiEmbeddings
      summary: OpenAI-compatible embeddings
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Embeddings.
          content:
            application/json:
              schema: { type: object }
        "404":
          description: >-
            Unknown model, or a decision model (`error.code:
            model_not_found`, "model \"<id>\" is a decision model: use POST
            /v1/systemone").
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/systemone:
    post:
      tags: [openai]
      operationId: systemOne
      summary: Typed decisions (TypeSafe-compatible System One API)
      description: |
        Answers bounded, typed questions about a `state` with a decision
        model (catalog `decision: true`) and returns probabilities instead
        of text: no tokens are generated and there is no streaming.

        `model` is a concrete catalog id (`laya-q8_0`), a manifest id
        (`laya`) or its `flock/<id>` alias; the latter two resolve to the
        quant this node has loaded, else has on disk, else the manifest's
        first (the same names work on the chat routes). The response's
        `model` is always the concrete id.

        Same contract as the mesh gateway's `POST /v1/systemone`
        (TypeSafe's request and response shapes):

        - **Order is preserved.** `answers` come back in the order the
          `questions` were written, and every `probabilities` / `legend`
          object is in the order of the question's `criteria`. Options are
          shown to the model in the order written.
        - `legend` is rebuilt from the request's `criteria`.
        - `images` is rejected (`422`): no decision model in the catalog
          takes image input under llama.cpp yet.
        - Unknown top-level fields are ignored.

        The model is loaded on demand when it is on disk but not in memory.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SystemOneRequest" }
            example:
              model: laya-q8_0
              state: "Help! My payouts have been failing for 3 days."
              questions:
                department:
                  type: choice
                  instructions: Which team should handle this?
                  criteria:
                    billing: "Payments, invoicing, refunds"
                    technical: null
                urgency:
                  type: score
                  instructions: How urgent is this?
                  criteria: [can wait, this week, today, right now]
                escalate:
                  type: noul
                  instructions: Does this need a human within the hour?
      responses:
        "200":
          description: One typed answer per question, in request order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemOneResponse" }
              example:
                model: laya-q8_0
                answers:
                  department:
                    type: choice
                    choice: billing
                    probabilities: { billing: 0.91, technical: 0.09 }
                    confidence: 0.82
                  urgency:
                    type: score
                    score: 2.09
                    legend: { "0": can wait, "1": this week, "2": today, "3": right now }
                    probabilities: { "0": 0.0, "1": 0.12, "2": 0.67, "3": 0.21 }
                    confidence: 0.67
                  escalate:
                    type: noul
                    noul: 0.63
                usage: { input_tokens: 239, output_tokens: 0 }
        "400":
          description: The body is not a JSON object.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: >-
            Unknown model, or a model that is not a decision model
            (`error.code: model_not_found`; chat models are served by
            `/v1/chat/completions`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: >-
            Validation failure (the message names the offending
            `questions.<id>` path), `images`, or input the runtime itself
            rejected (too many options for the model, a prompt over its
            context).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: The runtime failed to answer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: The governor refuses inference right now (state in the message).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Contents of `<data_dir>/local_api_token`.

  parameters:
    ModelID:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Model id (catalog id or cache id).

  responses:
    Ok:
      description: Success.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Ok" }
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Unknown model or resource.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unsupported:
      description: Not available on this node (mock runtime, or standalone).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Upstream:
      description: An upstream (catalog host, coordinator, runtime) failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type]
          properties:
            message: { type: string }
            type: { type: string }
            code:
              type: string
              description: Machine-readable code where one exists (`model_not_found`).

    Ok:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    Health:
      type: object
      required: [ok, version]
      properties:
        ok: { type: boolean }
        version: { type: string }

    Status:
      type: object
      required:
        [node_id, version, standalone, enrolled, state, uptime_seconds,
         default_model, activity, models_loaded, inflight, on_battery, temp_celsius,
         stats, memory, disk]
      properties:
        node_id:
          type: string
          description: Key fingerprint until enrolled; coordinator-assigned id after.
        version: { type: string }
        standalone: { type: boolean }
        enrolled: { type: boolean }
        cert_expires_at:
          type: string
          format: date-time
          description: Client-certificate expiry; present when enrolled.
        cert_rotation_error:
          type: string
          description: >
            Why the last due client-certificate rotation failed; absent when
            rotation is not due or succeeded. The node keeps serving on the
            current certificate and leaves the mesh when it expires unless a
            later restart rotates it or the node is re-enrolled.
        state:
          type: string
          description: >
            serving | starting | idle | no-model | yielded | paused-battery |
            paused-thermal | outside-schedule. `starting`: the default model
            is still being fetched or loaded; `idle`: nothing loaded but
            models are on disk (a placement or request loads one);
            `no-model`: nothing loaded and nothing on disk.
        uptime_seconds: { type: integer, format: int64 }
        default_model: { type: string }
        activity: { $ref: "#/components/schemas/NodeActivity" }
        models_loaded: { type: integer }
        inflight: { type: integer }
        on_battery: { type: boolean }
        temp_celsius: { type: number, format: double }
        hardware: { $ref: "#/components/schemas/Hardware" }
        runtime_accel:
          type: string
          description: >
            Accelerator backend of the llama-server build this node runs
            (`cuda12`, `rocm`, `vulkan`, `metal`, `cpu-avx2`, `cpu`): the
            first lane of the detection preference chain
            (cuda12 > rocm > vulkan > cpu) that the pinned runtime manifest
            publishes, so it can differ from `hardware.gpus[].accel` —
            an AMD box serves on `vulkan` while no ROCm build is published.
            Absent for the mock runtime.
        stats: { $ref: "#/components/schemas/Stats" }
        memory: { $ref: "#/components/schemas/Memory" }
        disk: { $ref: "#/components/schemas/Disk" }
        update:
          $ref: "#/components/schemas/Update"
          description: Present once the first version check has completed.

    Memory:
      type: object
      description: >
        Model memory on this node. `used_mb` is the measured footprint of
        every loaded runtime (physical footprint / proportional set size,
        not RSS, so mmap'd weight pages shared with the page cache are not
        double counted). `budget_mb` is what the daemon lets loaded models
        use in total before it unloads idle instances or declines a load.
      required: [used_mb, budget_mb, total_mb]
      properties:
        used_mb: { type: integer, format: int64 }
        budget_mb: { type: integer, format: int64 }
        total_mb: { type: integer, format: int64 }

    Disk:
      type: object
      description: >
        Model store usage. `models_bytes` counts complete artifacts,
        `partial_bytes` counts resumable `.partial` downloads, `budget_bytes`
        is `models.max_disk_mb` (0 = unlimited), `free_bytes` is free space
        on the volume holding the model directory.
      required: [models_bytes, partial_bytes, budget_bytes, free_bytes, dir]
      properties:
        models_bytes: { type: integer, format: int64 }
        partial_bytes: { type: integer, format: int64 }
        budget_bytes: { type: integer, format: int64 }
        free_bytes: { type: integer, format: int64 }
        dir:
          type: string
          description: Absolute path of the model directory.

    Update:
      type: object
      description: >
        Result of the last version check against the mesh's version feed.
        `minimum` is the oldest daemon the coordinator still serves; below
        it the node is drained until updated.
      required: [available, current, latest, checked_at]
      properties:
        available: { type: boolean }
        current: { type: string }
        latest: { type: string }
        minimum: { type: string }
        below_minimum: { type: boolean }
        url:
          type: string
          description: Release page / download for `latest`.
        checked_at: { type: string, format: date-time }

    Hardware:
      type: object
      required: [os, arch, cpu_model, cpu_cores, ram_mb, gpus]
      properties:
        os: { type: string }
        arch: { type: string }
        cpu_model: { type: string }
        cpu_cores: { type: integer, format: int64 }
        ram_mb: { type: integer, format: int64 }
        gpus:
          type: array
          items: { $ref: "#/components/schemas/Gpu" }

    Gpu:
      type: object
      required: [vendor, model, vram_mb, accel, unified_memory]
      properties:
        vendor: { type: string }
        model: { type: string }
        vram_mb: { type: integer, format: int64 }
        accel: { type: string }
        unified_memory: { type: boolean }

    Stats:
      type: object
      required:
        [tokens_per_sec_1m, requests_per_min, total_requests, total_tokens,
         inflight, earned_microcredits]
      properties:
        tokens_per_sec_1m: { type: number, format: double }
        requests_per_min: { type: number, format: double }
        total_requests: { type: integer, format: int64 }
        total_tokens: { type: integer, format: int64 }
        inflight: { type: integer }
        earned_microcredits: { type: integer, format: int64 }

    RequestKind:
      type: string
      enum: [chat, completion, embedding, decision]
      description: What the request asks of the model.

    RequestOrigin:
      type: string
      enum: [local, mesh, challenge]
      description: >-
        Who asked. `local`: this machine's local API (`/v1/*`). `mesh`: a
        coordinator dispatch — a customer request or a canary; a node
        cannot tell the two apart, by design. `challenge`: a fingerprint
        challenge from the coordinator.

    RequestOutcome:
      type: string
      enum: [ok, error, cancelled, invalid_input]
      description: >-
        `ok`: ran to completion. `cancelled`: stopped by the caller, the
        coordinator, a deadline or the governor (operator back at the
        machine). `invalid_input`: the runtime rejected the input itself
        (prompt over the model's context, too many options). `error`:
        anything else.

    InflightRequest:
      type: object
      description: A request a runtime is serving right now. No content.
      required: [id, model, kind, origin, started_at, elapsed_ms, tokens]
      properties:
        id:
          type: string
          description: >-
            Local to this daemon process (`r<counter>`); matches the
            `request_finished` event and the FinishedRequest row.
        model: { type: string }
        kind: { $ref: "#/components/schemas/RequestKind" }
        origin: { $ref: "#/components/schemas/RequestOrigin" }
        started_at: { type: string, format: date-time }
        elapsed_ms: { type: integer, format: int64 }
        tokens:
          type: integer
          description: >-
            Tokens generated so far (reasoning included). Always 0 for
            embeddings and decisions, which generate nothing.

    FinishedRequest:
      type: object
      description: A request that ended. No content.
      required:
        [id, model, kind, origin, started_at, duration_ms, prompt_tokens,
         completion_tokens, outcome]
      properties:
        id: { type: string }
        model: { type: string }
        kind: { $ref: "#/components/schemas/RequestKind" }
        origin: { $ref: "#/components/schemas/RequestOrigin" }
        started_at: { type: string, format: date-time }
        duration_ms: { type: integer, format: int64 }
        prompt_tokens:
          type: integer
          description: 0 when the runtime reported no usage (cancelled, failed).
        completion_tokens:
          type: integer
          description: >-
            Generated tokens: the runtime's usage figure, or the count
            streamed before a cancellation. 0 for embeddings and decisions.
        outcome: { $ref: "#/components/schemas/RequestOutcome" }

    ModelActivity:
      type: object
      description: One loaded model, and what it is doing.
      required: [model, kind, inflight, inflight_by_kind]
      properties:
        model: { type: string }
        kind:
          type: string
          enum: [chat, embedding, decision]
          description: What the model is for (catalog flags).
        inflight:
          type: integer
          description: Requests this model's runtime is serving right now.
        inflight_by_kind:
          type: object
          description: The same, by RequestKind (only kinds that are in flight).
          additionalProperties: { type: integer }
        last_request_at:
          type: string
          format: date-time
          description: >-
            When the most recent request started. Set the moment a
            request starts, so it is always present while `inflight` > 0;
            absent only when the model has served none since it was
            loaded.
        idle_seconds:
          type: integer
          format: int64
          description: >-
            Present while nothing is in flight: seconds since the last
            request started (since the load when there was none).

    ModelOperation:
      type: object
      description: >-
        Work on a model that uses the machine without a request: `loading`
        (a runtime starting: weights read into memory, GPU warm-up) or
        `downloading`.
      required: [model, op]
      properties:
        model: { type: string }
        op:
          type: string
          enum: [loading, downloading]
        started_at:
          type: string
          format: date-time
          description: Present for `loading`.
        received_bytes:
          type: integer
          format: int64
          description: Present for `downloading`.
        total_bytes:
          type: integer
          format: int64
          description: Present for `downloading`.

    NodeActivity:
      type: object
      description: The "now" summary carried by every Status.
      required: [models, operations]
      properties:
        models:
          type: array
          description: Every loaded model, sorted by id.
          items: { $ref: "#/components/schemas/ModelActivity" }
        operations:
          type: array
          items: { $ref: "#/components/schemas/ModelOperation" }

    RequestActivity:
      type: object
      required: [now, models, operations, inflight, recent]
      properties:
        now:
          type: string
          format: date-time
          description: The daemon's clock when the snapshot was taken.
        models:
          type: array
          items: { $ref: "#/components/schemas/ModelActivity" }
        operations:
          type: array
          items: { $ref: "#/components/schemas/ModelOperation" }
        inflight:
          type: array
          description: Oldest first.
          items: { $ref: "#/components/schemas/InflightRequest" }
        recent:
          type: array
          description: Newest first; at most 200 are kept.
          items: { $ref: "#/components/schemas/FinishedRequest" }

    ModelRow:
      type: object
      required: [id, size_bytes, pinned, last_used, state, loaded, default, origin]
      properties:
        id: { type: string }
        size_bytes: { type: integer, format: int64 }
        pinned: { type: boolean }
        last_used: { type: string, format: date-time }
        state:
          type: string
          description: >
            assigned | downloading | ready | missing. `assigned` is a
            coordinator placement queued behind other work (nothing on disk
            yet). `missing` means the index knows the model but its file is
            gone from disk (deleted outside the daemon); it no longer counts
            against the budget and loads re-download it.
        loaded: { type: boolean }
        default: { type: boolean }
        path:
          type: string
          description: Absolute artifact path; present when the file exists.
        loaded_mb:
          type: integer
          format: int64
          description: Measured memory footprint; present only while loaded.
        slots:
          type: integer
          description: >
            Present while loaded: requests the model serves at once right
            now. For a chat model it moves between `min_concurrent` and
            `max_concurrent` with demand.
        context_per_slot:
          type: integer
          description: Present while loaded; tokens of context each request gets.
        idle_since:
          type: string
          format: date-time
          description: >
            Present while loaded and not serving; the daemon unloads the
            instance after `idle_unload_seconds` (default model exempt).
        origin:
          type: string
          description: >
            Who installed it: `operator` (you, via the app/CLI/config) or
            `mesh` (coordinator placement). The mesh can only evict its
            own; yours are never touched.
        received_bytes:
          type: integer
          format: int64
          description: >
            Live progress summed over every file of the artifact; present
            only while downloading.
        parts_total:
          type: integer
          description: >
            Files in the artifact: the GGUF shards of a sharded model plus
            its mmproj sidecar when it has one. Present only for such
            multi-file models (a plain single-file model omits it). They
            live in `<models dir>/<id>/` under their upstream names;
            `path` is the first shard.
        parts_done:
          type: integer
          description: >
            How many of `parts_total` are downloaded and verified; present
            with it. Shards download one at a time, so the one in flight is
            `parts_done + 1`.
        assignment: { $ref: "#/components/schemas/Assignment" }

    Assignment:
      type: object
      description: >
        Coordinator placement status for this model, when the mesh asked
        for it. Failures and refusals stay visible for ten minutes.
      required: [state, since]
      properties:
        state:
          type: string
          description: >
            assigned | downloading | ready | cached | declined | failed |
            evicted. `cached` is a mesh-placed model that is on disk but
            unloaded (idle unload or memory pressure); the coordinator
            re-sends the assignment to load it when demand returns.
        since: { type: string, format: date-time }
        error:
          type: string
          description: Why it was declined or failed.

    ModelList:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items: { $ref: "#/components/schemas/ModelRow" }

    CatalogEntry:
      type: object
      description: A catalog model merged with this node's local state.
      required:
        [id, family, params_b, quant, sha256, min_vram_mb, min_ram_mb,
         license, artifact_url, size_bytes, payout_class, context_length,
         embeddings, decision, installed, loaded, default]
      properties:
        id: { type: string }
        display_name:
          type: string
          description: >-
            Human-readable name incl. quant ("Qwen3.8 27B · Q4_K_M") — show
            this, not the id: ids are ambiguous now that model lines carry
            point versions (qwen3-8b vs qwen3.8-27b). Optional: absent when
            the daemon's catalog predates the field.
        family: { type: string }
        params_b: { type: number, format: double }
        quant: { type: string }
        sha256: { type: string }
        min_vram_mb: { type: integer, format: int64 }
        min_ram_mb: { type: integer, format: int64 }
        license: { type: string }
        artifact_url: { type: string }
        size_bytes: { type: integer, format: int64 }
        payout_class: { type: string }
        context_length: { type: integer, format: int64 }
        embeddings: { type: boolean }
        decision:
          type: boolean
          description: >-
            A typed decision model: served by `POST /v1/systemone`, never
            by the chat endpoints. Mutually exclusive with `embeddings`.
        installed: { type: boolean }
        state:
          type: string
          description: downloading | ready; present when the artifact is local.
        received_bytes:
          type: integer
          format: int64
          description: >
            Live progress summed over every file; present only while
            downloading.
        total_bytes:
          type: integer
          format: int64
          description: >
            What the download fetches in all — `size_bytes` plus the mmproj
            sidecar when there is one — the denominator for
            `received_bytes`. Present only while downloading.
        parts_total:
          type: integer
          description: >
            Files in the artifact (GGUF shards plus mmproj); present only
            for multi-file models. `size_bytes` is already their sum.
        parts_done:
          type: integer
          description: >
            Files downloaded and verified so far; present while downloading
            a multi-file model.
        loaded: { type: boolean }
        default: { type: boolean }

    CatalogList:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items: { $ref: "#/components/schemas/CatalogEntry" }

    Earnings:
      type: object
      description: >-
        Earnings as this node knows them. `source: ledger` — the figures are
        the operator account's ledger position, pushed by the coordinator
        over the tunnel (every node of the operator together; settled =
        vested and redeemable, pending = in escrow until the canary window
        clears). `source: estimated` — no fresh ledger snapshot (standalone,
        not enrolled, or the tunnel has been down for two push intervals):
        a simulated figure from this node's own counters, labelled in
        `note`. The `*_credits` integer fields are ledger credits at
        `credits_per_usd`; the legacy `earned_credits` / `escrow_credits`
        doubles are those divided by 1e6.
      required:
        [source, earned_microcredits, earned_credits, est_usd, est_usd_per_day,
         lifetime_tokens, escrow_credits, note]
      properties:
        source:
          type: string
          enum: [ledger, estimated]
        as_of:
          type: string
          format: date-time
          description: When the coordinator read the ledger (ledger only).
        settled_credits:
          type: integer
          format: int64
          description: Vested, redeemable balance (ledger only).
        pending_credits:
          type: integer
          format: int64
          description: In escrow, vesting after the canary window (ledger only).
        earned_today_credits:
          type: integer
          format: int64
          description: Payout credits earned since 00:00 UTC (ledger only).
        earned_7d_credits:
          type: integer
          format: int64
          description: Payout credits earned in the trailing seven days (ledger only).
        lifetime_payout_credits:
          type: integer
          format: int64
          description: Payout credits earned since the account opened (ledger only).
        credits_per_usd:
          type: integer
          format: int64
          description: The coordinator's peg; dollars are credits divided by this (ledger only).
        next_vest_at:
          type: string
          format: date-time
          description: When the oldest pending lot vests; absent with nothing pending.
        earned_microcredits: { type: integer, format: int64 }
        earned_credits: { type: number, format: double }
        est_usd: { type: number, format: double }
        est_usd_per_day: { type: number, format: double }
        lifetime_tokens:
          type: integer
          format: int64
          description: Always this node's own count, whatever the source.
        escrow_credits: { type: number, format: double }
        note: { type: string }

    Limits:
      type: object
      description: >-
        The operator's settings. GET returns every field plus `settings`
        (metadata for each: tier, how a change is applied, default, range,
        configured vs effective value). PUT takes the same object: the six
        required fields always, any other field only when it changes
        (omitted = unchanged); `settings` is ignored on PUT. The whole PUT
        is validated before anything is applied. Values persist in
        `<data_dir>/limits.toml`, which overrides `config.toml`.
      required:
        [serve_policy, idle_after_seconds, yield_grace_seconds,
         serve_on_battery, max_temp_celsius, schedule]
      properties:
        serve_policy:
          type: string
          description: >-
            always | idle-only | scheduled. When this machine serves the mesh. `idle-only`: only while you
            are away from the keyboard and mouse. `scheduled`: only inside
            the schedule windows. `always`: whenever it is on.
        idle_after_seconds:
          type: integer
          minimum: 1
          description: >-
            With `idle-only`, how long keyboard and mouse must be quiet
            before the node starts serving. 0 on PUT = unchanged.
        yield_grace_seconds:
          type: integer
          minimum: 1
          description: >-
            When you come back to the machine, how long a request in
            flight may run on before it is cancelled. 0 on PUT = unchanged.
        serve_on_battery:
          type: boolean
          description: Serve while running on battery power.
        max_temp_celsius:
          type: number
          format: double
          minimum: 0
          maximum: 110
          description: Pause serving above this temperature; 0 disables the check.
        schedule:
          type: array
          items: { type: string }
          description: >
            Daily serving windows for serve_policy=scheduled, one per entry,
            each "HH:MM-HH:MM" in the node's local time on a 24-hour clock
            (the hour may be one or two digits, the minute must be two —
            Go's "15:04" layout). The end is exclusive: "09:00-17:00" serves
            09:00 through 16:59. A start later than its end wraps overnight
            ("22:00-08:00"); "22:00-00:00" runs to midnight; a window whose
            start equals its end matches nothing, so a full day is
            ["00:00-12:00", "12:00-00:00"]. The same windows apply every day
            (there is no day-of-week syntax) and an empty list never serves.
            An entry the daemon can't parse fails the whole PUT with 400;
            reads return windows normalised to zero-padded "HH:MM-HH:MM".
        mesh_managed:
          type: boolean
          description: >
            Let the mesh place models on this node (download, load, and
            evict what it placed) inside `models.max_disk_mb`, minus your
            pinned and excluded models. Off means the node serves only what
            you installed. Omitted on PUT = unchanged.
        max_disk_mb:
          type: integer
          format: int64
          minimum: 0
          description: >
            Model store budget (`models.max_disk_mb`); 0 = unlimited. LRU
            eviction of unpinned models keeps the store under it. Omitted
            on PUT = unchanged.
        retention_days:
          type: integer
          minimum: 0
          description: >
            Evict unpinned models not used for this many days (0 = never).
            Omitted on PUT = unchanged.
        max_ram_mb:
          type: integer
          format: int64
          minimum: 0
          description: >
            Memory budget for loaded models (`budget.max_ram_mb`); 0 = auto
            (about half of physical memory on unified-memory machines, the
            GPU budget on discrete GPUs). Omitted on PUT = unchanged.
        idle_unload_seconds:
          type: integer
          minimum: 0
          description: >
            Unload a loaded model after this long without a request
            (0 = never; default model exempt). Omitted on PUT = unchanged.
        max_concurrent:
          type: integer
          minimum: 0
          maximum: 64
          description: >
            Most requests one model serves at once (`budget.max_concurrent`):
            the ceiling on a model's slots and on mesh dispatches to this
            node. 0 = auto (16 with a GPU or unified memory, 2 on CPU).
            A chat model starts at `min_concurrent` slots and grows toward
            this ceiling under demand; every slot holds its own context in
            memory, so a lower ceiling leaves room for more models. Applied by restarting idle models;
            a busy one changes at its next load. Omitted on PUT = unchanged.
        min_concurrent:
          type: integer
          minimum: 0
          maximum: 64
          description: >
            Slots a chat model starts with (`budget.min_concurrent`). The
            node adds slots, up to `max_concurrent`, while requests are
            waiting, and gives them back when demand is gone or another
            model needs the memory. 0 = auto (2). Set it to
            `max_concurrent` (or higher) to pin the slot count. Applied
            like `max_concurrent`. Omitted on PUT = unchanged.
        max_context:
          type: integer
          minimum: 0
          maximum: 1048576
          description: >
            Largest context, in tokens, a single request gets
            (`runtime.max_context`); 0 = the model's own window. Memory per
            model grows with slots x context. 0, or 1024 and up. Applied
            like `max_concurrent`. Omitted on PUT = unchanged.
        min_context:
          type: integer
          minimum: 0
          maximum: 1048576
          description: >
            Smallest context a request is given (`runtime.min_context`):
            when memory is short the node gives up slots before going
            below it. 0 = 8192; otherwise 256 and up, and not above
            `max_context`. Applied like `max_concurrent`. Omitted on PUT =
            unchanged.
        context_length:
          type: integer
          minimum: 0
          maximum: 1048576
          description: >
            Pin every request's context to exactly this many tokens
            (`runtime.context_length`), for every model, decision models
            included; 0 = plan it from memory (recommended). 256 and up.
            Applied like `max_concurrent`. Omitted on PUT = unchanged.
        max_vram_percent:
          type: integer
          minimum: 1
          maximum: 100
          description: >
            Share of GPU memory models may use (`budget.max_vram_percent`):
            sizes the automatic memory budget on discrete GPUs and how
            many layers are offloaded. Takes effect after a daemon
            restart. Omitted on PUT = unchanged.
        exclude:
          type: array
          maxItems: 256
          items: { type: string }
          description: >
            Model ids the mesh may never place on this node
            (`models.exclude`). Applies to the next placement; a model
            already placed stays until evicted. Omitted on PUT = unchanged.
        default_model:
          type: string
          description: >
            Model loaded when the daemon starts (`models.default`); empty
            or `none` = load nothing and serve what the mesh places. Takes
            effect after a daemon restart (use `POST
            /api/v1/models/{id}/default` to switch now). Omitted on PUT =
            unchanged.
        require_auth_v1:
          type: boolean
          description: >
            Require the bearer token on the local inference routes
            (`/v1/*`) too (`local_api.require_auth_v1`). Off, any program
            on this machine can use the loaded models without a key.
            Applied immediately. Omitted on PUT = unchanged.
        log_level:
          type: string
          enum: [debug, info, warn, error]
          description: >
            Daemon log verbosity (`log.level`). Applied immediately.
            Omitted on PUT = unchanged.
        settings:
          type: array
          readOnly: true
          description: >-
            One entry per field above, in display order: everything an app
            needs to render the setting. Returned by GET and PUT; ignored
            when sent.
          items: { $ref: "#/components/schemas/LimitSetting" }

    LimitSetting:
      type: object
      description: Metadata and current state of one Limits field.
      required:
        [key, config_key, title, description, tier, apply, type, default,
         configured, pending_restart]
      properties:
        key:
          type: string
          description: The field's name in Limits (`max_concurrent`).
        config_key:
          type: string
          description: The same setting in config.toml (`budget.max_concurrent`).
        title:
          type: string
          description: Short label.
        description:
          type: string
          description: Help text (the field's description, in one paragraph).
        tier:
          type: string
          enum: [common, advanced]
          description: >-
            `common`: show by default. `advanced`: show under an Advanced
            section.
        apply:
          type: string
          enum: [live, reload, restart]
          description: >-
            How the daemon applies a change. `live`: immediately. `reload`:
            by restarting the runtimes of idle loaded models right away; a
            model with a request in flight keeps its layout until its next
            load. `restart`: saved now, used from the next daemon start
            (`pending_restart` is true until then).
        type:
          type: string
          enum: [boolean, integer, number, string, enum, string_list]
          description: How to edit the value.
        unit:
          type: string
          description: "Unit of an integer or number: seconds, MB, tokens, days, percent, °C, slots."
        min:
          type: number
          description: Smallest accepted value (integer and number types).
        max:
          type: number
          description: Largest accepted value; absent = unbounded.
        options:
          type: array
          items: { type: string }
          description: The accepted values of an `enum`.
        zero_means:
          type: string
          description: What the value 0 means when it is special ("auto", "never", "unlimited").
        default:
          description: The built-in default (the value's own JSON type).
        configured:
          description: >-
            The value as set (config.toml, limits.toml or this API): what
            GET returns in the field itself.
        effective:
          description: >-
            Present when the daemon is running with something other than
            `configured`: an `auto` (0) resolved for this machine
            (`max_concurrent` 0 -> 16), or the previous value of a
            `restart` setting whose change is pending.
        pending_restart:
          type: boolean
          description: A change is saved but the daemon must restart to use it.

    ActivityEvent:
      type: object
      required: [time, kind, actor, message]
      properties:
        time: { type: string, format: date-time }
        kind:
          type: string
          description: >
            download_started | downloaded | download_failed | loaded |
            unloaded | evicted | declined | missing | update_available |
            assignment
        actor:
          type: string
          description: mesh | operator | daemon
        model: { type: string }
        message:
          type: string
          description: Human-readable one-liner for activity feeds.
        detail:
          type: string
          description: Reason / error text when there is one.

    ActivityList:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/ActivityEvent" }

    LogEntry:
      type: object
      required: [time, level, message]
      properties:
        time: { type: string, format: date-time }
        level: { type: string }
        message: { type: string }
        attrs: { type: string }

    LogList:
      type: object
      required: [logs]
      properties:
        logs:
          type: array
          items: { $ref: "#/components/schemas/LogEntry" }

    PinRequest:
      type: object
      required: [pinned]
      properties:
        pinned: { type: boolean }

    DownloadStatus:
      type: object
      required: [ok, state]
      properties:
        ok: { type: boolean }
        state:
          type: string
          description: downloading | ready

    EnrollRequest:
      type: object
      required: [claim_code]
      properties:
        claim_code: { type: string }

    EnrollResponse:
      type: object
      required: [ok, node_id, cert_expires_at]
      properties:
        ok: { type: boolean }
        node_id: { type: string }
        cert_expires_at: { type: string, format: date-time }

    # ---- typed decisions (POST /v1/systemone) ----

    SystemOneJSON:
      description: >-
        Free-form content given to the model: a string, an object or an
        array. A value that is not a string reaches the model as compact
        JSON text.
      oneOf:
        - type: string
        - type: object
          additionalProperties: true
        - type: array
          items: {}

    SystemOneDescription:
      description: >-
        The description of one `choice` option: free-form content, or
        `null` for an option that needs none.
      nullable: true
      oneOf:
        - type: string
        - type: object
          additionalProperties: true
        - type: array
          items: {}

    SystemOneRequest:
      type: object
      required: [model, state, questions]
      properties:
        model:
          type: string
          description: >-
            Catalog id of a decision model (`decision: true`), or its
            `flock/<id>` alias.
        state:
          allOf:
            - $ref: "#/components/schemas/SystemOneJSON"
          description: The content to evaluate.
        questions:
          type: object
          description: >-
            Maps a question id (yours) to a question. 1 to 64 entries, ids
            unique. Key order is preserved: answers come back in this
            order.
          minProperties: 1
          maxProperties: 64
          additionalProperties:
            $ref: "#/components/schemas/SystemOneQuestion"

    SystemOneQuestion:
      description: One typed question, discriminated by `type`.
      oneOf:
        - $ref: "#/components/schemas/SystemOneChoiceQuestion"
        - $ref: "#/components/schemas/SystemOneScoreQuestion"
        - $ref: "#/components/schemas/SystemOneNoulQuestion"
      discriminator:
        propertyName: type
        mapping:
          choice: "#/components/schemas/SystemOneChoiceQuestion"
          score: "#/components/schemas/SystemOneScoreQuestion"
          noul: "#/components/schemas/SystemOneNoulQuestion"

    SystemOneChoiceQuestion:
      type: object
      description: Pick one of the labelled options.
      required: [type, instructions, criteria]
      properties:
        type: { type: string, enum: [choice] }
        instructions:
          allOf:
            - $ref: "#/components/schemas/SystemOneJSON"
          description: The question. Must not be empty.
        criteria:
          type: object
          description: >-
            Maps each option key to its description (or `null`). 2 to 255
            options, keys unique; the model reads them in the order
            written. The model may have a lower limit of its own (`422`).
          minProperties: 2
          maxProperties: 255
          additionalProperties:
            $ref: "#/components/schemas/SystemOneDescription"

    SystemOneScoreQuestion:
      type: object
      description: Place the state on an ordered scale.
      required: [type, instructions, criteria]
      properties:
        type: { type: string, enum: [score] }
        instructions:
          allOf:
            - $ref: "#/components/schemas/SystemOneJSON"
          description: The question. Must not be empty.
        criteria:
          type: array
          description: "2 to 10 level descriptions, lowest level first."
          minItems: 2
          maxItems: 10
          items:
            $ref: "#/components/schemas/SystemOneJSON"

    SystemOneNoulQuestion:
      type: object
      description: The probability that a yes/no statement is true.
      required: [type, instructions]
      properties:
        type: { type: string, enum: [noul] }
        instructions:
          allOf:
            - $ref: "#/components/schemas/SystemOneJSON"
          description: The statement or question. Must not be empty.
        criteria:
          type: object
          description: Optional. Exactly the descriptions of `true` and `false`.
          required: ["true", "false"]
          additionalProperties: false
          properties:
            "true": { $ref: "#/components/schemas/SystemOneJSON" }
            "false": { $ref: "#/components/schemas/SystemOneJSON" }

    SystemOneResponse:
      type: object
      required: [model, answers, usage]
      properties:
        model:
          type: string
          description: The catalog id of the model that answered.
        answers:
          type: object
          description: Maps each question id to its answer, in request order.
          additionalProperties:
            $ref: "#/components/schemas/SystemOneAnswer"
        usage:
          $ref: "#/components/schemas/SystemOneUsage"

    SystemOneAnswer:
      description: One typed answer, discriminated by `type` (the question's type).
      oneOf:
        - $ref: "#/components/schemas/SystemOneChoiceAnswer"
        - $ref: "#/components/schemas/SystemOneScoreAnswer"
        - $ref: "#/components/schemas/SystemOneNoulAnswer"
      discriminator:
        propertyName: type
        mapping:
          choice: "#/components/schemas/SystemOneChoiceAnswer"
          score: "#/components/schemas/SystemOneScoreAnswer"
          noul: "#/components/schemas/SystemOneNoulAnswer"

    SystemOneChoiceAnswer:
      type: object
      required: [type, choice, probabilities, confidence]
      properties:
        type: { type: string, enum: [choice] }
        choice:
          type: string
          description: The option key with the highest probability.
        probabilities:
          type: object
          description: >-
            The probability of each option, in the order of the question's
            `criteria`; they sum to 1.
          additionalProperties: { type: number, format: double }
        confidence:
          type: number
          format: double
          description: 0 to 1; 0 means all options are equally likely.

    SystemOneScoreAnswer:
      type: object
      required: [type, score, legend, probabilities, confidence]
      properties:
        type: { type: string, enum: [score] }
        score:
          type: number
          format: double
          description: >-
            The expected level index, weighted by probability; it can fall
            between two levels.
        legend:
          type: object
          description: >-
            The description of each level index (`"0"`, `"1"`, …), rebuilt
            from the request's `criteria`.
          additionalProperties:
            $ref: "#/components/schemas/SystemOneJSON"
        probabilities:
          type: object
          description: The probability of each level index, lowest first; they sum to 1.
          additionalProperties: { type: number, format: double }
        confidence:
          type: number
          format: double
          description: 0 to 1.

    SystemOneNoulAnswer:
      type: object
      required: [type, noul]
      properties:
        type: { type: string, enum: [noul] }
        noul:
          type: number
          format: double
          description: The probability that the answer is true.

    SystemOneUsage:
      type: object
      required: [input_tokens, output_tokens]
      properties:
        input_tokens:
          type: integer
          description: Prompt tokens across all questions.
        output_tokens:
          type: integer
          enum: [0]
          description: "Always 0: a decision model generates no tokens."
