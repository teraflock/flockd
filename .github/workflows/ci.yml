name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  GO_VERSION: "1.25"

jobs:
  # The proto contract repo is a sibling checkout (go.mod replace ../proto).
  # Each job checks both repos out side by side.

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { path: flockd }
      - uses: actions/checkout@v7
        with: { repository: teraflock/proto, path: proto }
      - uses: actions/setup-go@v7
        with: { go-version: "${{ env.GO_VERSION }}", cache-dependency-path: flockd/go.sum }
      - name: Lint
        working-directory: flockd
        run: |
          go install github.com/mgechev/revive@v1.15.0
          $(go env GOPATH)/bin/revive -formatter friendly ./...

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # Governor idle/yield logic is platform-behavioral: run its suite on
        # macOS and Windows runners too (SPEC §A3).
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with: { path: flockd }
      - uses: actions/checkout@v7
        with: { repository: teraflock/proto, path: proto }
      - uses: actions/setup-go@v7
        with: { go-version: "${{ env.GO_VERSION }}", cache-dependency-path: flockd/go.sum }
      - name: generated code matches the OpenAPI spec
        if: matrix.os == 'ubuntu-latest'
        working-directory: flockd
        run: make gen-check
      - name: unit tests
        working-directory: flockd
        run: go test ./...
      # Deliberate limits, revisited with the Windows epic
      # (https://github.com/teraflock/docs/issues/9): the race detector runs
      # on ubuntu only (the suites are platform-agnostic; macOS/Windows
      # runners are slow and add nothing), and the smoke test skips Windows
      # (scripts/smoke.sh is bash and Windows service management is not
      # implemented yet — flockd#28).
      - name: race (concurrency-heavy packages)
        if: matrix.os == 'ubuntu-latest'
        working-directory: flockd
        run: go test -race ./internal/governor/ ./internal/tunnel/... ./internal/runtime/... ./internal/localapi/
      - name: smoke (standalone end-to-end)
        if: matrix.os != 'windows-latest'
        working-directory: flockd
        run: ./scripts/smoke.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
        with: { path: flockd }
      - uses: actions/checkout@v7
        with: { repository: teraflock/proto, path: proto }
      - uses: actions/setup-go@v7
        with: { go-version: "${{ env.GO_VERSION }}", cache-dependency-path: flockd/go.sum }
      - name: cross-build
        working-directory: flockd
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build ./...
          go build -o /dev/null ./cmd/flockd
          go build -o /dev/null ./cmd/tera

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - name: build dashboard
        working-directory: web
        run: |
          npm ci
          npm run build
      # web/dist is committed (go:embed) so a fresh clone builds without
      # Node. Vite output is content-hashed and npm ci pins deps, so two
      # builds of the same tree are byte-identical: any diff here is a
      # forgotten `make web`. Fails since flockd#36 — masked drift is the
      # same bug class as the stale website image in the Phase 3 deploy.
      - name: ensure committed dist is not stale
        run: |
          git diff --exit-code --stat web/dist || \
            (echo "::error::web/dist is stale: run 'make web' and commit" && exit 1)
          if [ -n "$(git status --porcelain --untracked-files=all web/dist)" ]; then
            echo "::error::web/dist has untracked build output: run 'make web' and commit"
            git status --porcelain --untracked-files=all web/dist
            exit 1
          fi

  release:
    # Tag builds produce (unsigned, draft) release artifacts.
    # TODO(keys): cosign + notarization + Authenticode before public release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with: { path: flockd, fetch-depth: 0 }
      - uses: actions/checkout@v7
        with: { repository: teraflock/proto, path: proto }
      - uses: actions/setup-go@v7
        with: { go-version: "${{ env.GO_VERSION }}", cache-dependency-path: flockd/go.sum }
      - uses: goreleaser/goreleaser-action@v6
        with:
          workdir: flockd
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TAP_GITHUB_TOKEN is a PAT with write access to teraflock/homebrew-tap;
          # goreleaser uses it only for the formula push (see .goreleaser.yaml brews.token).
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
