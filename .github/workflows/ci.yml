name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  GO_VERSION: "1.25"

jobs:
  # The proto contract repo is a sibling checkout (go.mod replace ../proto).
  # Each job checks both repos out side by side.

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { path: flockd }
      - uses: actions/checkout@v7
        with: { repository: teraflock/proto, path: proto }
      - uses: actions/setup-go@v7
        with: { go-version: "${{ env.GO_VERSION }}", cache-dependency-path: flockd/go.sum }
      # The lint tools aren't dependencies in go.sum, so setup-go's module
      # cache above never covers them — cache the built binaries keyed on
      # the versions pinned in the Makefile (bump the key when those move);
      # `make lint-tools` itself skips reinstalling on a cache hit.
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/bin/revive
            ~/go/bin/staticcheck
            ~/go/bin/govulncheck
            ~/go/bin/bodyclose
            ~/go/bin/noctxcheck
          key: lint-tools-${{ runner.os }}-${{ hashFiles('flockd/Makefile', 'flockd/tools/noctxcheck/go.sum') }}
      # Builds the tools under the Makefile's LINT_TOOLCHAIN (Go 1.26)
      # regardless of setup-go's GOTOOLCHAIN=local; the checkers below
      # then run under the go.mod toolchain.
      - name: Install lint tools
        working-directory: flockd
        run: make lint-tools
      # One step per checker so a red job names the tool that raised it.
      # Every step fails on any finding (revive.toml sets errorCode = 1).
      - name: revive (revive.toml)
        working-directory: flockd
        run: make lint-revive
      - name: staticcheck
        working-directory: flockd
        run: make lint-staticcheck
      - name: bodyclose + noctx
        working-directory: flockd
        run: make lint-http
      - name: govulncheck
        working-directory: flockd
        run: make lint-vuln

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # Governor idle/yield logic is platform-behavioral: run its suite on
        # macOS and Windows runners too (SPEC §A3).
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with: { path: flockd }
      - uses: actions/checkout@v7
        with: { repository: teraflock/proto, path: proto }
      - uses: actions/setup-go@v7
        with: { go-version: "${{ env.GO_VERSION }}", cache-dependency-path: flockd/go.sum }
      - name: generated code matches the OpenAPI spec
        if: matrix.os == 'ubuntu-latest'
        working-directory: flockd
        run: make gen-check
      - name: unit tests
        working-directory: flockd
        run: go test ./...
      # Deliberate limits, revisited with the Windows epic
      # (https://github.com/teraflock/docs/issues/9): the race detector runs
      # on ubuntu only (the suites are platform-agnostic; macOS/Windows
      # runners are slow and add nothing), and the smoke test skips Windows
      # (scripts/smoke.sh is bash and Windows service management is not
      # implemented yet — flockd#28).
      - name: race (concurrency-heavy packages)
        if: matrix.os == 'ubuntu-latest'
        working-directory: flockd
        run: go test -race ./internal/governor/ ./internal/tunnel/... ./internal/runtime/... ./internal/localapi/
      - name: smoke (standalone end-to-end)
        if: matrix.os != 'windows-latest'
        working-directory: flockd
        run: ./scripts/smoke.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
        with: { path: flockd }
      - uses: actions/checkout@v7
        with: { repository: teraflock/proto, path: proto }
      - uses: actions/setup-go@v7
        with: { go-version: "${{ env.GO_VERSION }}", cache-dependency-path: flockd/go.sum }
      - name: cross-build
        working-directory: flockd
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build ./...
          go build -o /dev/null ./cmd/flockd
          go build -o /dev/null ./cmd/tera

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - name: build dashboard
        working-directory: web
        run: |
          npm ci
          npm run build
      # web/dist is committed (go:embed) so a fresh clone builds without
      # Node. Vite output is content-hashed and npm ci pins deps, so two
      # builds of the same tree are byte-identical: any diff here is a
      # forgotten `make web`. Fails since flockd#36 — masked drift is the
      # same bug class as the stale website image in the Phase 3 deploy.
      - name: ensure committed dist is not stale
        run: |
          git diff --exit-code --stat web/dist || \
            (echo "::error::web/dist is stale: run 'make web' and commit" && exit 1)
          if [ -n "$(git status --porcelain --untracked-files=all web/dist)" ]; then
            echo "::error::web/dist has untracked build output: run 'make web' and commit"
            git status --porcelain --untracked-files=all web/dist
            exit 1
          fi

  release:
    # Tag builds publish release artifacts. The three signing legs (macOS
    # Developer ID + notarization, Windows Authenticode, cosign bundle over
    # checksums.txt) each run when their secrets/variables exist and are
    # enforced by the SIGNING_REQUIRED variable; present secrets are always
    # used and a signing failure always fails the job (flockd#26; policy in
    # scripts/release/lib.sh). One Linux runner does all of it: rcodesign
    # notarizes from Linux, jsign talks to Azure Trusted Signing from Linux.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # cosign keyless (Fulcio) and the AWS OIDC role for COSIGN_MODE=kms
    env:
      # Repository/org VARIABLES (not secrets): the switches Anderson flips.
      SIGNING_REQUIRED: ${{ vars.SIGNING_REQUIRED }}
      COSIGN_MODE: ${{ vars.COSIGN_MODE }}
      COSIGN_KMS_KEY: ${{ vars.COSIGN_KMS_KEY }}
      AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
      # Org SECRETS from docs#35 (Apple) and docs#37 (Azure). Same names as
      # the desktop repo's release workflow; keep them identical.
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # The pkg job does the installer signing, but preflight here decides
      # the plan for the whole tag: SIGNING_REQUIRED=pkg is enforced in this
      # job, and TERAFLOCK_MACOS_PKG is what makes goreleaser leave the
      # binary cask unpublished so the tap moves once, to the package.
      APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
      APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with: { path: flockd, fetch-depth: 0 }
      - uses: actions/checkout@v7
        with: { repository: teraflock/proto, path: proto }
      - uses: actions/setup-go@v7
        with: { go-version: "${{ env.GO_VERSION }}", cache-dependency-path: flockd/go.sum }
      - name: Signing preflight (fails early when SIGNING_REQUIRED cannot be met)
        working-directory: flockd
        run: scripts/release/preflight.sh
      - name: Release tooling (rcodesign, jsign; pinned, sha256-verified)
        working-directory: flockd
        run: scripts/release/install-tools.sh
      - uses: sigstore/cosign-installer@v3
        if: env.COSIGN_MODE != ''
      - name: AWS credentials for the KMS signing key (COSIGN_MODE=kms)
        if: env.COSIGN_MODE == 'kms' && vars.AWS_ROLE_TO_ASSUME != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          workdir: flockd
          # GORELEASER_SIGN_ARGS is "--skip=sign" when COSIGN_MODE is unset.
          args: release --clean ${{ env.GORELEASER_SIGN_ARGS }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TAP_GITHUB_TOKEN is a PAT with write access to teraflock/homebrew-tap;
          # goreleaser uses it only for the cask push (see .goreleaser.yaml homebrew_casks.repository.token).
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

  pkg:
    # The macOS installer package (flockd#47): built with pkgbuild on a Mac
    # from the darwin binaries the release job just published (already
    # Developer ID signed + notarized there), then Installer-signed,
    # notarized and stapled with rcodesign, attached to the release, and
    # the Homebrew cask is pointed at it. Runs only when preflight.sh sees
    # the installer certificate; SIGNING_REQUIRED=pkg makes its absence
    # fatal. When it runs, goreleaser leaves the binary cask unpublished
    # (.goreleaser.yaml homebrew_casks.skip_upload) so the tap moves once,
    # to the package.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      SIGNING_REQUIRED: ${{ vars.SIGNING_REQUIRED }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
      APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: Signing preflight
        run: scripts/release/preflight.sh
      - name: Release tooling (rcodesign; pinned, sha256-verified)
        if: env.TERAFLOCK_MACOS_PKG == 'true'
        run: scripts/release/install-tools.sh
      - name: Fetch the published darwin binaries
        if: env.TERAFLOCK_MACOS_PKG == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p dist/pkg
          gh release download "$GITHUB_REF_NAME" -p "flockd_${version}_darwin_all.tar.gz" -D dist/pkg
          tar -xzf "dist/pkg/flockd_${version}_darwin_all.tar.gz" -C dist/pkg flockd tera
      - name: Build, sign, notarize and staple the package
        if: env.TERAFLOCK_MACOS_PKG == 'true'
        run: scripts/release/build-pkg.sh "$VERSION" dist/pkg/flockd dist/pkg/tera "dist/pkg/teraflock_${VERSION}_darwin_all.pkg"
      - name: Attach the package to the release
        if: env.TERAFLOCK_MACOS_PKG == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "dist/pkg/teraflock_${VERSION}_darwin_all.pkg" --clobber
      - name: Publish the cask (installs the package)
        if: env.TERAFLOCK_MACOS_PKG == 'true'
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: scripts/release/publish-cask.sh "$VERSION" "dist/pkg/teraflock_${VERSION}_darwin_all.pkg"
      - name: Package leg skipped
        if: env.TERAFLOCK_MACOS_PKG != 'true'
        run: echo "pkg leg not configured (APPLE_INSTALLER_CERTIFICATE missing); goreleaser published the binary cask as before"
